<script>
    const slug = "radio-cielo";

    // Detectar si la aplicación está en modo standalone
    if (!window.matchMedia('(display-mode: standalone)').matches) {
        // Redirigir al perfil de la radio si no está en modo standalone
        //window.location.href = "<//?php echo BASEURL; ?>/radio/<//?php echo $radio['ceo_url']; ?>";
    }

    // Variable global para almacenar el evento deferredPrompt
    let deferredPrompt = null;

    // Detectar el evento beforeinstallprompt
    window.addEventListener("beforeinstallprompt", (e) => {
        console.log("[PWA] Evento beforeinstallprompt detectado.");
        e.preventDefault(); // Prevenir el comportamiento predeterminado
        deferredPrompt = e; // Guardar evento

        // Mostrar el botón de instalación
        const installButtonWrapper = document.getElementById("installButtonWrapper");
        const installButton = document.getElementById("installButton");
        const openButton = document.getElementById("openButton");

        if (installButtonWrapper && installButton) {
            installButtonWrapper.style.display = "block";
            installButton.style.display = "block";
            openButton.style.display = "none";

            // Texto según dispositivo
            const userAgent = navigator.userAgent;
            if (userAgent.includes("Android")) {
                installButton.textContent = "Instalar en tu Android";
            } else if (userAgent.includes("iPhone") || userAgent.includes("iPad")) {
                installButton.textContent = "Instalar en tu iOS";
            } else if (userAgent.includes("Windows") || userAgent.includes("Macintosh")) {
                installButton.textContent = "Instalar en tu PC";
            } else {
                installButton.textContent = "Instalar en tu dispositivo";
            }

            // Clic en el botón de instalar
            installButton.addEventListener("click", () => {
                if (deferredPrompt) {
                    console.log("[PWA] Mostrando prompt...");
                    deferredPrompt.prompt();

                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === "accepted") {
                            console.log("[PWA] Instalación aceptada.");
                            installButton.style.display = "none";
                            openButton.style.display = "block";
                        } else {
                            console.log("[PWA] Instalación rechazada.");
                        }
                        deferredPrompt = null;
                    });
                }
            });
        }
    });

    // Detectar si ya está instalada
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;

    document.addEventListener("DOMContentLoaded", () => {
        const installButtonWrapper = document.getElementById("installButtonWrapper");
        const installButton = document.getElementById("installButton");
        const openButton = document.getElementById("openButton");

        if (isStandalone) {
            console.log("[PWA] App ya instalada.");
            if (installButtonWrapper && installButton && openButton) {
                installButtonWrapper.style.display = "block";
                installButton.style.display = "none";
                openButton.style.display = "block";
            }
        } else {
            console.log("[PWA] App no instalada.");
            if (installButtonWrapper && installButton && openButton) {
                installButtonWrapper.style.display = "block";
                installButton.style.display = "block";
                openButton.style.display = "none";
            }
        }
    });

    // ✅ Registrar el Service Worker con slug y scope único
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/app/" + slug + "/sw.js", {
            scope: "/app/" + slug + "/"
        }).then((registration) => {
            console.log("[Service Worker] Registrado correctamente:", registration);
        }).catch((error) => {
            console.error("[Service Worker] Error al registrar:", error);
        });
    }
</script>
